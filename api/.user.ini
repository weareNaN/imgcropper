; PHP limits for this folder (read by PHP-FPM/CGI hosts; changes can take up to 5 minutes to apply).
; The app sends the image as a raw request body, so post_max_size is the limit that matters
; (PHP's default is 8M). upload_max_filesize is kept for completeness.
post_max_size = 20M
upload_max_filesize = 16M
